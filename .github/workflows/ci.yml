name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download cloudflared
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force resources/bin | Out-Null
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "resources/bin/cloudflared.exe"
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Verify bundled cloudflared
        shell: pwsh
        run: |
          if (!(Test-Path "resources/bin/cloudflared.exe")) { throw "cloudflared.exe is missing" }
          & "resources/bin/cloudflared.exe" --version
